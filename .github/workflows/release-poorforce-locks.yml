name: Release Poorforce locks

on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '재실행할 PR 번호 (이미 머지된 PR)'
        required: true
        type: string

permissions:
  contents: write   # git lfs unlock API 호출에 필요
  pull-requests: read   # workflow_dispatch 에서 PR 정보 조회용

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # actor 의 PAT 선택 — actor 본인이 잡은 LFS 락은 본인 PAT 으로 unlock 가능 (admin 권한 불필요).
      # 매핑 없으면 token 빈 값 → checkout 이 기본 GITHUB_TOKEN fallback → LFS unlock 실패 시 Discord 알림.
      - name: Pick LFS PAT for actor
        id: pat
        env:
          # 팀원별 fine-grained PAT (Contents: R/W). 시크릿 이름 컨벤션: PAT_<GITHUB_USERNAME_UPPER>
          PAT_DOOYEONK: ${{ secrets.PAT_DOOYEONK }}
          PAT_EUNSEOGITHUB: ${{ secrets.PAT_EUNSEOGITHUB }}
          PAT_OOD11611DOO: ${{ secrets.PAT_OOD11611DOO }}
          PAT_YOONSEO4343: ${{ secrets.PAT_YOONSEO4343 }}
          PAT_JCMEVE: ${{ secrets.PAT_JCMEVE }}
          PAT_HYUN0619: ${{ secrets.PAT_HYUN0619 }}
          PAT_SALTLAKE00: ${{ secrets.PAT_SALTLAKE00 }}
          PAT_KBROTHER102: ${{ secrets.PAT_KBROTHER102 }}
        run: |
          case "${{ github.actor }}" in
            dooyeonk) PAT="$PAT_DOOYEONK" ;;
            eunseoGithub) PAT="$PAT_EUNSEOGITHUB" ;;
            ood11611doo) PAT="$PAT_OOD11611DOO" ;;
            yoonseo4343) PAT="$PAT_YOONSEO4343" ;;
            jcmeve) PAT="$PAT_JCMEVE" ;;
            hyun0619) PAT="$PAT_HYUN0619" ;;
            saltlake00) PAT="$PAT_SALTLAKE00" ;;
            kbrother102) PAT="$PAT_KBROTHER102" ;;
            *)
              PAT=""
              echo "::warning::No PAT mapped for actor=${{ github.actor }} — LFS unlock will fall back to Discord notification"
              ;;
          esac
          if [[ -n "$PAT" ]]; then
            echo "::add-mask::$PAT"
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
            echo "token=$PAT" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ steps.pat.outputs.token || github.token }}

      - name: Resolve PR SHAs
        id: shas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}")
            BASE_SHA=$(echo "$PR_JSON" | jq -r .base.sha)
            HEAD_SHA=$(echo "$PR_JSON" | jq -r .head.sha)
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved: base=$BASE_SHA head=$HEAD_SHA"

      - name: Make scripts executable
        run: chmod +x Plugins/Poorforce/scripts/release-locks.sh Plugins/Poorforce/scripts/release-lfs-locks.sh

      - name: Compute lock keys from changed files
        id: keys
        env:
          BASE_SHA: ${{ steps.shas.outputs.base }}
          HEAD_SHA: ${{ steps.shas.outputs.head }}
        run: |
          # Content/<첫폴더>/ 를 떼고 gy:asset: prefix 부여 — PoorforceConfig ManagedPaths 의
          # ContentPath(/Game/GY/, /Game/ThirdParty/, /Game/GYEditor/) 1-depth 가정.
          # 에디터 자동 생성 폴더(Collections/Developers/__*__) 는 락 대상 아니므로 제외.
          git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -E '^Content/[^/]+/.*\.(uasset|umap)$' \
            | grep -Ev '^Content/(Collections|Developers|__[^/]+__)/' \
            | sed -E 's#^Content/[^/]+/##; s#\.(uasset|umap)$##; s#^#gy:asset:#' \
            > keys.txt || true
          echo "count=$(wc -l < keys.txt)" >> "$GITHUB_OUTPUT"

      - name: Compute LFS paths from changed files
        id: lfspaths
        env:
          BASE_SHA: ${{ steps.shas.outputs.base }}
          HEAD_SHA: ${{ steps.shas.outputs.head }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -E '^Content/[^/]+/.*\.(uasset|umap)$' \
            | grep -Ev '^Content/(Collections|Developers|__[^/]+__)/' \
            > lfs_paths.txt || true
          echo "count=$(wc -l < lfs_paths.txt)" >> "$GITHUB_OUTPUT"

      - name: Release Redis locks
        id: redis
        if: steps.keys.outputs.count != '0'
        env:
          UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
        run: cat keys.txt | ./Plugins/Poorforce/scripts/release-locks.sh

      # actor 본인 PAT 으로 인증된 git 환경 (checkout 단계) 이라 본인 락은 admin 권한 없이 unlock 가능.
      # PAT 매핑 없는 actor 면 skip → Discord 알림 fallback.
      - name: Release LFS locks
        id: lfs
        if: ${{ !cancelled() && steps.lfspaths.outputs.count != '0' && steps.pat.outputs.has_pat == 'true' }}
        run: cat lfs_paths.txt | ./Plugins/Poorforce/scripts/release-lfs-locks.sh

      # PAT 매핑 없거나 unlock 실패 시 admin/팀원에게 수동 해제 요청.
      - name: Notify Discord — LFS manual unlock needed
        if: ${{ !cancelled() && steps.lfspaths.outputs.count != '0' && (steps.pat.outputs.has_pat != 'true' || steps.lfs.outcome == 'failure') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_REF="#${{ inputs.pr_number }} (수동 재실행)"
          else
            PR_REF="#${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}"
          fi
          LFS_LIST=$(head -n 30 lfs_paths.txt)
          LFS_COUNT=$(wc -l < lfs_paths.txt)

          if [[ "${{ steps.pat.outputs.has_pat }}" == "true" ]]; then
            REASON="actor=${{ github.actor }} 본인 PAT 으로 unlock 시도했으나 실패 (다른 사람 락이 섞여있거나 PAT 만료 가능)"
          else
            REASON="actor=${{ github.actor }} PAT 매핑 없음 — 본인 PAT 시크릿(PAT_<USERNAME>) 등록 필요"
          fi

          CONTENT="🔓 **LFS 락 수동 해제 필요** — ${PR_REF}
          ${REASON}

          **경로 (${LFS_COUNT}개)**
          \`\`\`
          ${LFS_LIST}
          \`\`\`"

          PAYLOAD=$(jq -n --arg c "$CONTENT" '{content: $c}')
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      # ── 릴리스 이후: 수정자 본인이 아직 들고 있는 잔여 락 알림 ──────────────
      # 수정자 = 이 PR 을 만든 사람(작성자). Redis 소유자 이메일 == PR 커밋 author 이메일
      # (둘 다 같은 git config user.email 에서 나옴 → 하드코딩 매핑 불필요).
      # LFS 소유자 == PR 작성자 GitHub login.
      - name: Resolve modifier identity
        id: who
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LOGIN=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}" --jq .user.login)
          else
            LOGIN="${{ github.event.pull_request.user.login }}"
          fi
          # PR 커밋들의 author 이메일 (보통 1명). Redis 락 소유자 매칭에 사용.
          git log "${{ steps.shas.outputs.base }}..${{ steps.shas.outputs.head }}" \
            --format='%ae' | sort -u | grep -v '^$' > modifier_emails.txt || true
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT"
          echo "Modifier login=$LOGIN, emails=$(tr '\n' ' ' < modifier_emails.txt)"

      # SCAN gy:asset:* → MGET → 값의 소유자(email)가 수정자면 남긴다.
      # 락 값 포맷은 "<owner-email>|<unix-ts>" (LockServerClient::MakeLockValue).
      - name: List remaining Redis locks (modifier)
        id: redis_remaining
        if: ${{ !cancelled() }}
        env:
          UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
          MATCH_PATTERN: 'gy:asset:*'
        run: |
          : > redis_remaining.txt
          if [[ ! -s modifier_emails.txt ]]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          redis() {
            curl -sS -X POST "$UPSTASH_URL/" \
              -H "Authorization: Bearer $UPSTASH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$1"
          }

          # 1) SCAN 커서 루프로 매칭 키 전체 수집 (SCAN 은 중복 반환 가능 → 뒤에서 unique)
          cursor="0"
          all_keys="[]"
          while : ; do
            resp=$(redis "$(jq -nc --arg c "$cursor" --arg m "$MATCH_PATTERN" '["SCAN",$c,"MATCH",$m,"COUNT","1000"]')")
            if echo "$resp" | jq -e 'has("error")' >/dev/null 2>&1; then
              echo "::warning::Redis SCAN failed — $resp"
              echo "count=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cursor=$(echo "$resp" | jq -r '.result[0]')
            all_keys=$(jq -nc --argjson a "$all_keys" --argjson b "$(echo "$resp" | jq -c '.result[1]')" '$a + $b')
            if [[ "$cursor" == "0" ]]; then break; fi
          done
          all_keys=$(echo "$all_keys" | jq -c 'unique')

          if [[ "$(echo "$all_keys" | jq 'length')" -eq 0 ]]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) MGET 으로 값(소유자) 조회 — 키/값 순서 1:1 대응
          vals=$(redis "$(echo "$all_keys" | jq -c '["MGET"] + .')" | jq -c '.result')

          # 3) 소유자가 수정자 이메일(대소문자 무시)인 키만 남김
          owners=$(jq -R 'ascii_downcase' modifier_emails.txt | jq -sc .)
          jq -rn --argjson keys "$all_keys" --argjson vals "$vals" --argjson owners "$owners" '
            range(0; ($keys | length)) as $i
            | { key: $keys[$i], owner: (($vals[$i] // "") | split("|")[0] | ascii_downcase) }
            | select(.owner as $o | $owners | index($o) != null)
            | .key' > redis_remaining.txt

          echo "count=$(wc -l < redis_remaining.txt)" >> "$GITHUB_OUTPUT"

      - name: List remaining LFS locks (modifier)
        id: lfs_remaining
        if: ${{ !cancelled() }}
        run: |
          LOGIN="${{ steps.who.outputs.login }}"
          git lfs locks --json > all_locks.json 2>/dev/null || echo '[]' > all_locks.json
          # git lfs locks --json 은 배열 또는 {"locks":[...]} 형태일 수 있어 둘 다 처리
          jq -r --arg u "$LOGIN" '
            (if type == "array" then . else (.locks // []) end)
            | [ .[] | select(((.owner.name) // "") | ascii_downcase == ($u | ascii_downcase)) | .path ]
            | .[]' all_locks.json > lfs_remaining.txt || true
          echo "count=$(wc -l < lfs_remaining.txt)" >> "$GITHUB_OUTPUT"

      - name: Notify Discord — remaining locks
        if: ${{ !cancelled() && (steps.redis_remaining.outputs.count != '0' || steps.lfs_remaining.outputs.count != '0') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ID_DOOYEONK: ${{ secrets.DISCORD_ID_DOOYEONK }}
          DISCORD_ID_EUNSEOGITHUB: ${{ secrets.DISCORD_ID_EUNSEOGITHUB }}
          DISCORD_ID_OOD11611DOO: ${{ secrets.DISCORD_ID_OOD11611DOO }}
          DISCORD_ID_YOONSEO4343: ${{ secrets.DISCORD_ID_YOONSEO4343 }}
          DISCORD_ID_JCMEVE: ${{ secrets.DISCORD_ID_JCMEVE }}
          DISCORD_ID_HYUN0619: ${{ secrets.DISCORD_ID_HYUN0619 }}
          DISCORD_ID_SALTLAKE00: ${{ secrets.DISCORD_ID_SALTLAKE00 }}
          DISCORD_ID_KBROTHER102: ${{ secrets.DISCORD_ID_KBROTHER102 }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_REF="#${{ inputs.pr_number }} (수동 재실행)"
          else
            PR_REF="#${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}"
          fi

          # 수정자(PR 작성자) login → Discord 유저 ID. 매핑/시크릿 없으면 멘션 생략.
          case "${{ steps.who.outputs.login }}" in
            dooyeonk)     DISCORD_ID="$DISCORD_ID_DOOYEONK" ;;
            eunseoGithub) DISCORD_ID="$DISCORD_ID_EUNSEOGITHUB" ;;
            ood11611doo)  DISCORD_ID="$DISCORD_ID_OOD11611DOO" ;;
            yoonseo4343)  DISCORD_ID="$DISCORD_ID_YOONSEO4343" ;;
            jcmeve)       DISCORD_ID="$DISCORD_ID_JCMEVE" ;;
            hyun0619)     DISCORD_ID="$DISCORD_ID_HYUN0619" ;;
            saltlake00)   DISCORD_ID="$DISCORD_ID_SALTLAKE00" ;;
            kbrother102)  DISCORD_ID="$DISCORD_ID_KBROTHER102" ;;
            *)            DISCORD_ID="" ;;
          esac
          # 시크릿에 공백/개행이 섞이면 allowed_mentions 가 400 → 숫자만 남긴다
          DISCORD_ID="${DISCORD_ID//[^0-9]/}"
          MENTION=""
          if [[ -n "$DISCORD_ID" ]]; then MENTION="<@${DISCORD_ID}> "; fi

          REDIS_COUNT=$(wc -l < redis_remaining.txt)
          LFS_COUNT=$(wc -l < lfs_remaining.txt)

          # Discord 2000자 제한 회피: 각 섹션 최대 12줄 + 바이트 상한(경로가 긴 LFS 대비)
          REDIS_LIST=$(sed -E 's#^[^:]*:asset:##' redis_remaining.txt | head -n 12 | head -c 800)
          LFS_LIST=$(head -n 12 lfs_remaining.txt | head -c 800)
          [[ -z "$REDIS_LIST" ]] && REDIS_LIST="(없음)"
          [[ -z "$LFS_LIST" ]] && LFS_LIST="(없음)"

          REDIS_MORE=""
          if [[ "$REDIS_COUNT" -gt 12 ]]; then
            REDIS_MORE="
          … 외 $((REDIS_COUNT - 12))개"
          fi
          LFS_MORE=""
          if [[ "$LFS_COUNT" -gt 12 ]]; then
            LFS_MORE="
          … 외 $((LFS_COUNT - 12))개"
          fi

          CONTENT="${MENTION}🔒 **머지 후 잔여 락 알림** — ${PR_REF}
          수정자: **${{ steps.who.outputs.login }}**
          아직 편집 중이 아니면 정리해 주세요.

          **Poorforce(Redis) 잔여 락 (${REDIS_COUNT}개)**
          \`\`\`
          ${REDIS_LIST}${REDIS_MORE}
          \`\`\`
          **LFS 잔여 락 (${LFS_COUNT}개)**
          \`\`\`
          ${LFS_LIST}${LFS_MORE}
          \`\`\`"

          # 최후 안전장치: 그래도 길면 하드 컷 (Discord 2000자 초과 = 400 방지)
          if [[ ${#CONTENT} -gt 1900 ]]; then
            CONTENT="${CONTENT:0:1900}
          … (메시지가 길어 생략됨)"
          fi

          # allowed_mentions 로 실제 핑 허용 (해당 유저만, 없으면 아무도 핑 안 함)
          if [[ -n "$DISCORD_ID" ]]; then
            PAYLOAD=$(jq -n --arg c "$CONTENT" --arg uid "$DISCORD_ID" \
              '{content: $c, allowed_mentions: {users: [$uid]}}')
          else
            PAYLOAD=$(jq -n --arg c "$CONTENT" '{content: $c, allowed_mentions: {parse: []}}')
          fi
          HTTP_CODE=$(curl -sS -o /tmp/discord_resp.json -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL")
          if [[ "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::Discord webhook 실패 ($HTTP_CODE): $(cat /tmp/discord_resp.json)"
            exit 1
          fi
          echo "Discord 알림 전송됨 (HTTP $HTTP_CODE)"

      - name: Notify Discord on Redis failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REDIS_OUTCOME: ${{ steps.redis.outcome }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_REF="#${{ inputs.pr_number }} (수동 재실행)"
          else
            PR_REF="#${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}"
          fi

          if [[ "$REDIS_OUTCOME" == "failure" ]]; then
            REDIS_LIST=$(head -n 30 keys.txt 2>/dev/null || echo "(목록 파일 없음)")
            REDIS_COUNT=$(wc -l < keys.txt 2>/dev/null || echo 0)
            DETAIL="**Redis 키 (${REDIS_COUNT}개)**
          \`\`\`
          ${REDIS_LIST}
          \`\`\`"
          else
            DETAIL="(Redis release 단계 이전에서 실패 — 워크플로우 로그 확인 필요)"
          fi

          CONTENT="🚨 **Poorforce Redis 락 해제 실패** — ${PR_REF}
          ${RUN_URL}

          ${DETAIL}

          수동 재해제: \`Run workflow\` 로 PR 번호 입력해서 재시도"

          PAYLOAD=$(jq -n --arg c "$CONTENT" '{content: $c}')
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
